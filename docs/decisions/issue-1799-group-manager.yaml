document:
  title: "Issue #1799 — Group Manager decisions"
  format_version: 1
  status: decided
  last_updated: "2026-08-18"

issue:
  number: 1799
  title: "Add group manager role"
  url: "https://github.com/Selleo/mentingo/issues/1799"
  delivery_target: "End of August 2026"
  objective: >-
    Add a read-only, client-facing Group Manager role whose access to learner
    progress, statistics, exports, live-training statistics, and optionally
    certificates is strictly limited to groups assigned by an administrator.

principles:
  - id: P1
    statement: "Backend authorization is authoritative; frontend visibility is not a security boundary."
    source: "Repository AGENTS.md and issue compliance requirement"
  - id: P2
    statement: "No Group Manager response or export may contain data derived solely from unassigned groups."
    source: "Issue #1799"
  - id: P3
    statement: "The role grants read-only monitoring capabilities and no mutation capabilities."
    source: "Issue #1799"

decisions:
  - id: D001
    topic: "Manager-to-group persistence"
    status: decided
    decision: >-
      Store manager assignments separately from learner group membership;
      do not reuse the existing group_users relationship.
    rationale:
      - "group_users represents learner membership in the current domain model."
      - "Changing group_users triggers learner course-enrollment synchronization."
      - "A separate relationship prevents accidental manager enrollment and makes authorization intent explicit."
    evidence:
      - "apps/api/src/storage/schema/index.ts: groupUsers"
      - "apps/api/src/group/group.service.ts: setUserGroups and syncUserGroupEnrollment"

resolved_questions:
  - id: Q001
    topic: "Certificate scope"
    status: decided
    decision: "Include certificate functionality in issue #1799."
    includes:
      - "A certificate tab within course statistics."
      - "Enrolled learner certificate status."
      - "Certificate expiry information when applicable."
      - "Certificate preview."
      - "Watermarked certificate preview without another learner's download action."
    security_requirement: >-
      Certificate metadata, preview, and download must each enforce assigned-group
      scope in the API, including direct requests using known identifiers.
    recommendation_followed: false
  - id: Q002
    topic: "Membership timing semantics"
    status: decided
    decision: >-
      Use current group membership. Removing a learner from the last group shared
      with a manager immediately revokes access to that learner's scoped data.
    applies_to:
      - "Course and development-path statistics"
      - "Dashboard statistics"
      - "XLSX/report exports"
      - "Live-training statistics"
      - "Certificate metadata, preview, and download"
    recommendation_followed: true
  - id: Q003
    topic: "Enrollment visibility boundary"
    status: decided
    decision: >-
      Current membership in at least one manager-assigned group grants visibility
      to that learner's complete training progress, including individually assigned
      enrollments and enrollments originating from other groups.
    boundary: >-
      The manager may see only learners who currently share at least one assigned
      group; the enrollment source does not further restrict visible progress.
    consequence: >-
      Queries must first establish the authorized learner set from current group
      membership, then scope all progress, statistics, exports, live-training data,
      and certificates to that learner set.
    recommendation_followed: false
  - id: Q004
    topic: "Overlapping group aggregation"
    status: decided
    decision: >-
      Deduplicate learners and underlying records in combined statistics and
      exports. A learner may appear once in each applicable group when the output
      is explicitly grouped or filtered by group.
    recommendation_followed: true
  - id: Q005
    topic: "Role combinations"
    status: decided
    decision: >-
      Allow Group Manager to coexist with every other role, including Admin,
      Content Creator, Trainer, and Student. Effective access is the union of all
      assigned roles.
    clarification: >-
      Group-scoping constraints apply to access granted by the Group Manager role;
      broader access independently granted by another role remains valid.
    ownership: >-
      Administrators assigning roles are responsible for the broader privileges
      created by role combinations.
    recommendation_followed: false
  - id: Q006
    topic: "Manager with no assigned groups"
    status: decided
    decision: >-
      Allow Group Manager accounts with zero managed-group assignments. Group
      Manager-derived reads return empty datasets and the UI displays an empty state.
    invariant: "An empty managed-group assignment set never means unrestricted access."
    recommendation_followed: true
  - id: Q007
    topic: "Assignment administration UX"
    status: decided
    decision: >-
      Add a separate "Managed groups" multi-select to user create/edit, shown when
      Group Manager is selected. Do not reuse the learner "Groups" field and do
      not add reverse assignment controls to the group page in the first release.
    recommendation_followed: true
  - id: Q008
    topic: "Role removal cleanup"
    status: decided
    decision: >-
      Delete all managed-group assignments when the Group Manager role is removed.
      Re-adding the role requires an administrator to assign managed groups again.
    recommendation_followed: true
  - id: Q009
    topic: "Group Manager application experience"
    status: decided
    decision: >-
      Reuse existing dashboard, course, development-path, and live-training screens
      and navigation. Render them read-only according to effective permissions and
      populate them exclusively with API-scoped data. Do not build a separate portal.
    recommendation_followed: true
  - id: Q010
    topic: "Course content visibility"
    status: decided
    decision: >-
      Group Managers may browse the full course curriculum and lesson content in a
      read-only preview experience. Browsing as a manager must not create or update
      learner progress, completion, learning-time, quiz-attempt, or activity records.
    implementation_constraint: >-
      Manager preview state must be distinct from learner consumption state; no
      progress-tracking API or client-side tracker may run because of preview browsing.
    recommendation_followed: false
  - id: Q011
    topic: "Detailed assessment visibility"
    status: decided
    decision: >-
      Group Managers may see detailed assessment data for authorized learners,
      including submitted quiz answers, task responses, and AI Mentor result details,
      in addition to scores, attempts, timestamps, completion, and learning time.
    security_requirement: >-
      Every detail and preview endpoint must independently authorize the target
      learner against the manager's current authorized learner set.
    recommendation_followed: false
  - id: Q012
    topic: "Learner identity fields"
    status: decided
    decision: >-
      Show learner name, email address, and names of currently shared assigned groups
      in screens and exports. Hide unrelated profile/security fields, internal IDs,
      and membership in groups not assigned to the manager.
    recommendation_followed: true
  - id: Q013
    topic: "Certificate actions"
    status: decided
    decision: >-
      Group Managers may list certificate status and preview certificates belonging
      to authorized learners. They may not download another learner's certificate
      and may not share, issue, regenerate, revoke, or otherwise mutate certificates.
    own_certificate_rule: >-
      A user may download their own certificate only through independently applicable
      learner/self-service authorization, not because they hold Group Manager.
    recommendation_followed: partially
  - id: Q014
    topic: "Statistics export initiation"
    status: decided
    decision: >-
      Group Managers may request and download synchronously generated XLSX/statistics
      reports. Generating a report does not grant permission to edit domain data.
    security_requirement: >-
      Scope is enforced during file generation and authorization is checked again
      before download.
    recommendation_followed: true
  - id: Q015
    topic: "Synchronous XLSX scope consistency"
    status: decided
    decision: >-
      Authorize the request against current managed groups and learner memberships,
      generate the XLSX synchronously from that scoped dataset, and return it in the
      same HTTP response. No stored-export invalidation mechanism is required.
    clarification: >-
      The existing summary-report flow does not persist a file for later download;
      the relevant consistency window is only the generation request itself.
    recommendation_followed: true
  - id: Q016
    topic: "Dashboard calendar scope"
    status: decided
    decision: >-
      Show required-course deadlines and live trainings involving at least one
      currently authorized learner. Exclude learner-created AI Mentor calendar
      events from Group Manager-derived access.
    recommendation_followed: true
  - id: Q017
    topic: "Visible training catalog"
    status: decided
    decision: >-
      Show only courses and development paths with at least one enrollment belonging
      to a currently authorized learner. Remove the item when it has no remaining
      authorized learner enrollments.
    recommendation_followed: true
  - id: Q018
    topic: "User directory access"
    status: decided
    decision: >-
      Do not grant Group Manager access to the Users administration area or learner
      profile pages. Show approved identity fields only within authorized monitoring
      and reporting views; learner names do not link to inaccessible profiles.
    recommendation_followed: true
  - id: Q019
    topic: "Out-of-scope object response"
    status: decided
    decision: >-
      Return 404 for out-of-scope object IDs. Reject out-of-scope filter IDs instead
      of ignoring them. Return an empty successful collection only when the requested
      scope is valid but contains no records.
    recommendation_followed: true
  - id: Q020
    topic: "Assignment audit trail"
    status: decided
    decision: >-
      Record managed-group additions, removals, and role-removal cleanup in the
      existing activity log, including acting admin, target manager, timestamp,
      and affected group IDs and names. Group Manager does not receive activity-log
      access unless another role independently grants it.
    recommendation_followed: true
  - id: Q021
    topic: "Bulk user import support"
    status: decided
    decision: >-
      Accept group_manager as an import role slug, but do not import managed-group
      assignments in this release. The groups column continues to mean learner
      membership. Imported Group Managers begin with zero managed groups.
    recommendation_followed: true
  - id: Q022
    topic: "Certificate tab records and statuses"
    status: decided
    decision: >-
      List every authorized learner enrolled in the course, including learners with
      no certificate. Show not-earned, active, expired, or revoked status and issue/
      expiry dates when available. Allow preview for active and expired certificates,
      but not revoked certificates.
    recommendation_followed: true
  - id: Q023
    topic: "Certificate history depth"
    status: decided
    decision: >-
      Show only each learner's current effective certificate state in the initial
      certificate table. Do not expose full issuance or renewal history.
    recommendation_followed: true
  - id: Q024
    topic: "Active-session behavior after scope changes"
    status: decided
    decision: >-
      Revoke all active sessions and emit the existing permissions-updated client
      notification after any managed-group assignment change. Require fresh sign-in
      so stale cached data from the previous scope is no longer displayed.
    recommendation_followed: true
  - id: Q025
    topic: "Group-targeted announcements"
    status: decided
    decision: >-
      Managed-group assignment does not make a manager a recipient of learner-targeted
      group announcements. Announcement delivery continues to use actual membership
      and tenant-wide audience rules.
    recommendation_followed: true
  - id: Q026
    topic: "Live-training roster scope"
    status: decided
    decision: >-
      Show session metadata and trainer/host identity. Restrict participant rows and
      all attendance/completion counts and percentages to currently authorized learners.
    recommendation_followed: true
  - id: Q027
    topic: "Certificate preview versus download"
    status: decided
    decision: >-
      Do not expose a download button or download endpoint for another learner's
      certificate. Render a watermarked, screen-oriented preview and acknowledge that
      screenshots or extraction of browser-delivered pixels cannot be prevented.
    recommendation_followed: true
  - id: Q028
    topic: "Role-name localization"
    status: decided
    decision: >-
      Add reviewed role-name translations for every supported locale, using
      "Group Manager" as temporary fallback. Keep group_manager as the stable
      locale-independent internal and import slug.
    recommendation_followed: true
  - id: Q029
    topic: "Rollout gating"
    status: decided
    decision: >-
      Make Group Manager available to every tenant without a tenant feature flag.
      It remains dormant until an administrator explicitly assigns the role and
      managed groups; existing users receive no new access.
    recommendation_followed: true
  - id: Q030
    topic: "Implementation delivery structure"
    status: decided
    decision: >-
      Deliver the complete feature in one batch, including authorization foundation,
      assignment UX, every scoped data surface, certificates, documentation, and
      security tests. Do not split delivery into staged pull requests.
    recommendation_followed: false

implementation_notes:
  confirmed:
    - "The system currently supports multiple roles per user."
    - "Permissions are centralized in packages/shared/src/constants/permissions.ts."
    - "Course, aggregate dashboard, XLSX/report, learning-path, and live-training reads use separate API paths and each must enforce group scope."
  provisional: []

verification_requirements:
  - "Positive tests for data inside every assigned group."
  - "Negative tests for data outside assigned groups, including mixed assigned/unassigned datasets."
  - "Export assertions must inspect generated rows, not only endpoint status."
  - "Manual test matrix must cover one group, multiple groups, no groups, and assignment removal."
