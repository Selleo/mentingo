services:
  project-db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: guidebook
      POSTGRES_DB: guidebook
    volumes:
      - lms-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.0-M02-alpine3.20
    restart: always
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - lms-redis-data:/data
  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: always
    ports:
      - "9100:9000" # S3 API
      - "9101:9001" # Web console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data
    command: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-rustfs-bucket:
    image: amazon/aws-cli:latest
    container_name: rustfs-setup
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    env_file: ./apps/api/.env
    environment:
      S3_ENDPOINT: http://rustfs:9000
    volumes:
      - ./create-rustfs-bucket.sh:/create-rustfs-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-rustfs-bucket.sh"]

volumes:
  lms-db-data:
    driver: local
  lms-redis-data:
    driver: local
  rustfs-data:
    driver: local
