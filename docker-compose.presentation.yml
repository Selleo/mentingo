services:
  presentation-converter:
    image: gotenberg/gotenberg:8.34.0-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --api-body-limit=106MB
      - --api-disable-download-from=true
      - --webhook-disable=true
      - --pdfengines-disable-routes=true
      - --libreoffice-deny-list=.*
      - --libreoffice-restart-after=1
      - --libreoffice-max-queue-size=4
    read_only: true
    user: "1001:1001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /home/gotenberg:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=700
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    ulimits:
      core: 0
      nofile: 1024
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Supply PRESENTATION_CONVERTER_URL=http://presentation-converter:3000 to an API
    # container on this Compose network. Never publish this port in production.
