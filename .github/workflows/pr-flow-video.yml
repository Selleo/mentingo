name: PR flow video
on:
  workflow_call:
    inputs:
      pr_number:
        description: Same-repository PR to demonstrate through a trusted caller
        required: true
        type: string
      branch_test:
        description: Manual full recording test; the environment must explicitly allow this branch
        required: false
        type: boolean
        default: false
      retry_run_id:
        description: Completed recording run whose verified bundle should be attached
        required: false
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      ELEVENLABS_API_KEY:
        required: true
      PR_VIDEO_UPLOAD_TOKEN:
        description: Native media token supplied by the attachment job environment
        required: false
  pull_request:
    types: [opened, ready_for_review]
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to demonstrate
        required: true
        type: number
      requested_by:
        description: Original readiness actor (set by the trusted dispatcher)
        required: false
        type: string
      expected_head:
        description: Expected PR head SHA (automatic dispatch pins the readiness event)
        required: false
        type: string
permissions: {}
concurrency:
  group: pr-flow-video-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false
  queue: max
jobs:
  dispatch:
    # Metadata only. The PR merge workflow dispatches a recorder on its trusted base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch the trusted base-branch recorder
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_REF" == staging || "$BASE_REF" == main ]]
          # Read current eligibility explicitly rather than silently skipping the job
          # on PR event payload fields. The recorder independently checks these again.
          eligible=$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq \
            '.state == "open" and .draft == false and .head.repo.full_name == env.REPOSITORY
              and .head.sha == env.HEAD_SHA and .base.ref == env.BASE_REF')
          if [ "$eligible" != true ]; then
            echo "Skipping: PR is draft, closed, external or no longer matches this event."
            exit 0
          fi
          author=$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq .user.login)
          for login in "$REQUESTED_BY" "$author"; do
            permission=$(gh api "repos/$REPOSITORY/collaborators/$login/permission" --jq .permission)
            case "$permission" in
              admin|maintain|write) ;;
              *) echo "Skipping: PR author and readiness actor must both be repository writers."; exit 0 ;;
            esac
          done
          echo "Dispatching PR #$NUMBER at $HEAD_SHA from $BASE_REF."
          gh workflow run release-film.yml --repo "$REPOSITORY" --ref "$BASE_REF" \
            -f "pr_number=$NUMBER" -f "expected_head=$HEAD_SHA" -f "requested_by=$REQUESTED_BY" -f publish=false

  film:
    if: github.event_name == 'workflow_dispatch' && !inputs.retry_run_id && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || inputs.branch_test == true)
    name: Analyze and record visible PR flows
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: release-film
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.inspect.outputs.number }}
      head: ${{ steps.inspect.outputs.head }}
      record: ${{ steps.plan.outputs.record }}
    env:
      S: .agents/skills/release-film/scripts
      RELEASE_FILM_HOME: /mnt/pr-flow-video
      RELEASE_FILM_CI: '1'
      RELEASE_FILM_CI_WORKERS: '1'
      RELEASE_FILM_LLM: cli
      RELEASE_FILM_VOICE: elevenlabs
      GH_TOKEN: ${{ github.token }}
      ELEVENLABS_VOICE_ID_FEMALE_1: ${{ vars.ELEVENLABS_VOICE_ID_FEMALE_1 }}
      ELEVENLABS_VOICE_ID_FEMALE_2: ${{ vars.ELEVENLABS_VOICE_ID_FEMALE_2 }}
      ELEVENLABS_VOICE_ID_MALE_1: ${{ vars.ELEVENLABS_VOICE_ID_MALE_1 }}
      ELEVENLABS_VOICE_ID_MALE_2: ${{ vars.ELEVENLABS_VOICE_ID_MALE_2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - name: Validate PR identity and collect its overview and business specs
        id: inspect
        run: python3 "$S/pr_video.py" inspect --run "$RUNNER_TEMP/pr-video"
      - name: Validate the existing recording credentials
        if: steps.inspect.outputs.eligible == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          required = ('CLAUDE_CODE_OAUTH_TOKEN', 'ELEVENLABS_API_KEY')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing recording secrets: ' + ', '.join(missing))
          print('Both existing recording credentials are configured.')
          PY
      - name: Install the pinned semantic planner
        if: steps.inspect.outputs.eligible == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --global '@anthropic-ai/claude-code@2.1.283'
      - name: Select only visible changed flows
        id: plan
        if: steps.inspect.outputs.eligible == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 "$S/pr_video.py" plan --run "$RUNNER_TEMP/pr-video"
      - name: Report the semantic decision
        if: steps.inspect.outputs.eligible == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP'])/'pr-video/pr-video-plan.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('PR video decision: ' + result['decision'] + '.\n')
              report.write('Selected flows: ' + str(len(result['flows'])) + '.\n')
          PY
      - name: Install the recorder tools only for visible changes
        if: steps.plan.outputs.record == 'true'
        run: |
          bash .agents/skills/release-film/ci/install-tools.sh
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$RELEASE_FILM_HOME"
      - name: Record the immutable PR head with demo data
        if: steps.plan.outputs.record == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 "$S/pr_video.py" record --run "$RUNNER_TEMP/pr-video" --bundle "$RUNNER_TEMP/pr-video-bundle"
      - name: Preserve the redacted recording report
        if: always() && steps.plan.outputs.record == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-flow-video-report-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-video/pr-video-recording-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve only the verified PR video bundle
        if: steps.plan.outputs.record == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-flow-video-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr-video-bundle/video.mp4
            ${{ runner.temp }}/pr-video-bundle/pr-video.json
          if-no-files-found: error
          retention-days: 14
  attach:
    name: Attach the matching PR video
    needs: film
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || inputs.branch_test == true) &&
          (inputs.retry_run_id != '' ||
           (needs.film.result == 'success' && needs.film.outputs.record == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-film
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the previous PR video run
        if: inputs.retry_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.retry_run_id }}
          NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ github.event.inputs.expected_head }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          safe_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '
            .event == "workflow_dispatch" and .status == "completed"
            and .path == ".github/workflows/release-film.yml"
            and .head_repository.full_name == env.GITHUB_REPOSITORY
            and (.head_branch == "main" or .head_branch == "staging" or .head_branch == env.GITHUB_REF_NAME)')
          [[ "$safe_run" == true ]]
          # Only the successful recorder may supply a bundle for this publisher.
          recorded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" --jq '
            any(.jobs[]; (.name | endswith(" / Analyze and record visible PR flows"))
                         and .conclusion == "success")')
          [[ "$recorded" == true ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-flow-video-${{ inputs.retry_run_id || github.run_id }}
          path: ${{ runner.temp }}/pr-video-bundle
          run-id: ${{ inputs.retry_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Append or replace the generated video section
        env:
          GH_TOKEN: ${{ github.token }}
          PR_VIDEO_UPLOAD_TOKEN: ${{ secrets.PR_VIDEO_UPLOAD_TOKEN }}
          NUMBER: ${{ inputs.retry_run_id && inputs.pr_number || needs.film.outputs.number }}
          HEAD_SHA: ${{ inputs.retry_run_id && github.event.inputs.expected_head || needs.film.outputs.head }}
          SOURCE_RUN: ${{ inputs.retry_run_id || github.run_id }}
        run: |
          if [ -z "${PR_VIDEO_UPLOAD_TOKEN}" ]; then
            echo "::error::Missing PR_VIDEO_UPLOAD_TOKEN in the release-film environment"
            exit 1
          fi
          python3 .agents/skills/release-film/ci/pr_video_publish.py \
            --bundle "$RUNNER_TEMP/pr-video-bundle" --repository "$GITHUB_REPOSITORY" \
            --number "$NUMBER" --head-sha "$HEAD_SHA" --run-id "$SOURCE_RUN"
