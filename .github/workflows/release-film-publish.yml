name: Publish release film

# Attaches a film that release-film.yml recorded (the release-film artifact of the run given) to a release: the film,
# its page as a ZIP, its captions and poster, with a section of links in the release notes. It records nothing and
# holds no Claude token. It never replaces or deletes an asset: a re-run adds what is missing and stops at an asset
# of the same name and other content. The draft target publishes to a test draft release made for the tag (deleted
# by hand after checking); the release target to the tag's published release, and then rebuilds the public GitHub
# Pages site of the films from the releases themselves; the pages target only rebuilds that site. release-film.yml
# calls it after each recording (target release, its own run's film); it can also be started by hand.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the Release film run whose film to publish (from its URL; not used by pages)
        required: false
        type: string
      target:
        description: A test draft release made for the tag, the tag's release (and the Pages site), or the site only
        required: true
        type: choice
        options: [draft, release, pages]
        default: draft
  workflow_call:
    inputs:
      run_id:
        description: ID of the run whose film to publish (the caller's own run)
        required: true
        type: string
      target:
        description: draft, release or pages
        required: true
        type: string
  # Until this workflow is on main: a push of it to the skill branch registers it, so
  # `gh workflow run release-film-publish.yml --ref <branch>` can start it; that run publishes nothing.
  push:
    branches: [gz_chore_release_film_skill]
    paths:
      - .github/workflows/release-film-publish.yml
      - .agents/skills/release-film/ci/release_assets.py

permissions: {}

jobs:
  publish:
    name: Publish the release film
    if: ${{ inputs.target != 'pages' }}
    runs-on: ubuntu-24.04
    concurrency: # on the job: this workflow also runs inside a recording's run
      group: release-film-publish
      cancel-in-progress: false
      queue: max # a second film waiting to be published is never cancelled
    timeout-minutes: 20
    permissions:
      actions: read # the recording run's artifact
      contents: write # the release's assets and notes
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the publishing helper
        run: python3 .agents/skills/release-film/ci/release_assets.py --help >/dev/null

      - name: Check the recording run was given
        if: env.PUBLISH == 'true' && inputs.run_id == ''
        run: |
          echo "::error::run_id (the Release film run whose film to publish) is required for draft and release"
          exit 1

      - name: Download the recorded film
        if: env.PUBLISH == 'true' && inputs.run_id != github.run_id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-film
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-film

      - name: Download the film this run recorded
        if: env.PUBLISH == 'true' && inputs.run_id == github.run_id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-film
          path: ${{ runner.temp }}/release-film

      - name: Publish the film
        if: env.PUBLISH == 'true'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python3 .agents/skills/release-film/ci/release_assets.py publish --dir "${RUNNER_TEMP}/release-film" \
            --target "${TARGET}" | tee "${RUNNER_TEMP}/published.json"
          python3 - "${RUNNER_TEMP}/published.json" >> "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json, sys
          done = json.load(open(sys.argv[1]))
          print(f"## Release film published ({done['target']})\n\n{done['release']}\n\n"
                f"Uploaded: {', '.join(done['uploaded']) or 'nothing new'}; notes {done['notes']}.")
          PY

  # The public site of the films (https://<owner>.github.io/<repo>/), rebuilt from every published release's film
  # page ZIP: GitHub Pages keeps one site, so each deployment carries all films.
  pages:
    name: Update the release films site
    needs: publish
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.target == 'pages' || inputs.target == 'release' && needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-film-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # the releases' page ZIPs
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the site from the releases' films
        run: python3 .agents/skills/release-film/ci/release_assets.py site --out "${RUNNER_TEMP}/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
