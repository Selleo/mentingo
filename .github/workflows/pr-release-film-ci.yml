name: Release Film Pull Request Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "*"
    paths:
      - .agents/skills/release-film/**
      - .github/workflows/release-film.yml
      - .github/workflows/release-film-on-release.yml
      - .github/workflows/release-film-publish.yml
      - .github/workflows/pr-release-film-ci.yml

permissions:
  contents: read

jobs:
  test:
    # Fast contracts and planning checks; real rendering is in the manual media workflow.
    name: Release film skill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The capture test runs the TypeScript capture on Node's own type stripping (22.7 or newer).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'websockets==15.0.1'
      - name: Run the release film unit tests
        run: python -B .agents/skills/release-film/tests/run_checks.py release
