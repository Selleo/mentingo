name: Release Film Pull Request Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "*"
    paths:
      - .agents/skills/release-film/**
      - .github/workflows/release-film.yml
      - .github/workflows/release-film-on-release.yml
      - .github/workflows/release-film-publish.yml
      - .github/workflows/pr-release-film-ci.yml

permissions:
  contents: read

jobs:
  test:
    # The release film skill's own tests: synthetic data, FFmpeg and no model (release-film.yml records the films).
    name: Release film skill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The capture test runs the TypeScript capture on Node's own type stripping (22.7 or newer).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0

      - name: Install FFmpeg, fonts, PDF tools and PyYAML
        timeout-minutes: 7
        run: |
          # Hosted images usually already contain these tools; avoid unnecessary mirror access.
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && command -v pdftoppm >/dev/null && test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf && python3 -c "import yaml"; then
            exit 0
          fi
          # Use the primary HTTPS Ubuntu archive, not the runner's Azure mirror list.
          . /etc/os-release
          source_list="$RUNNER_TEMP/media-ci-ubuntu.list"
          for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main restricted universe multiverse"
          done > "$source_list"
          apt_options=(-o "Dir::Etc::sourcelist=$source_list" -o "Dir::Etc::sourceparts=-" -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          timeout 180s sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update -qq
          timeout 180s sudo apt-get "${apt_options[@]}" install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core poppler-utils python3-yaml

      - name: Run the release film skill tests
        working-directory: .agents/skills/release-film
        run: python3 -B -m unittest discover -s tests
