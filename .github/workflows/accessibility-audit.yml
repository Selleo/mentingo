name: Accessibility audit (WCAG 2.1 AA)

# Runs the axe-core + keyboard/reflow audit in apps/web/e2e/a11y-audit, uploads the scored report
# (artifact "wcag-audit-report", also in the job summary) and fails on violations missing from
# apps/web/e2e/a11y-audit/wcag-baseline.json.

env:
  HUSKY: 0

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'run accessibility audit ♿' }}
    uses: ./.github/workflows/e2e.yml
    with:
      browser: chromium
      suite: a11y-audit
    secrets:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
      LUMA_BASE_URL: ${{ secrets.LUMA_BASE_URL }}
