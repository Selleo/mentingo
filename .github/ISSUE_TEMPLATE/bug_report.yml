name: Bug report
description: Something in Mentingo does not work as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please do not report security vulnerabilities here - see [SECURITY.md](https://github.com/Selleo/mentingo/blob/main/SECURITY.md)."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Go to ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which role were you signed in as?
      options: [Admin, Content creator, Learner, Not signed in, Not applicable]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mentingo version or commit
      placeholder: "v4.18.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Local development setup, Self-hosted, Managed by Selleo, AWS Marketplace]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, and anything non-default (AI provider, SSO provider, storage).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant API or browser console output. Remove secrets and personal data first.
      render: shell
